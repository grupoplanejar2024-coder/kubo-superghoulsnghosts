<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Ghouls 'n Ghosts - Kubo Touch</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #121212; color: #fff; font-family: Arial, sans-serif; }
        header { text-align: center; padding: 15px; background: #1e1e1e; }
        .badge { background: #f39c12; color: #fff; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        #game-card { max-width: 500px; margin: 20px auto; background: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .cover-container { width: 100%; height: 250px; background-image: url('superghoulsnghosts-cover.jpg'); background-size: cover; background-position: center; }
        .content { padding: 20px; }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #f1c40f; }
        .meta-info { display: flex; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #aaa; }
        .description { font-size: 14px; line-height: 1.5; color: #ddd; margin-bottom: 15px; }
        .details { font-size: 13px; color: #bbb; margin-bottom: 20px; }
        .details ul { padding-left: 20px; margin: 0; }
        .btn-play { display: block; width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; }
        .btn-play:hover { background: #219150; }
        #game-container { display: none; width: 100%; height: 100vh; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <header>
        <span class="badge">KUBO TOUCH</span>
    </header>

    <div id="game-card">
        <div class="cover-container"></div>
        <div class="content">
            <h1>Super Ghouls 'n Ghosts</h1>
            <div class="meta-info">
                <span>🎮 1 Jogador</span>
                <span>📅 1991</span>
                <span>🏢 Capcom</span>
            </div>

            <p class="description">
                Prepare-se para o teste definitivo de habilidade! Ajude o valente cavaleiro Arthur a enfrentar hordas de monstros, zumbis e demônios para resgatar a princesa.
            </p>

            <div class="details">
                <ul>
                    <li><strong>🎯 Gênero:</strong> Plataforma / Ação</li>
                </ul>
            </div>

            <button class="btn-play" onclick="startEmulator()">► JOGAR AGORA</button>
        </div>
    </div>

    <div id="game-container">
        <div style="width:100%; height:100%; max-width:100%;">
            <div id="game"></div>
        </div>
    </div>

    <script>
        function startEmulator() {
            document.getElementById('game-card').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            window.EJS_player = "#game";
            window.EJS_core = "snes9x";
            window.EJS_gameName = "Super Ghouls 'n Ghosts";
            window.EJS_color = "#f39c12";
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            
            // Link direto para a ROM do Super Ghouls 'n Ghosts no novo repositório
            window.EJS_gameUrl = "https://raw.githubusercontent.com/grupoplanejar2024-coder/kubo-superghoulsnghosts/main/superghoulsnghosts.sfc";

            let script = document.createElement("script");
            script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
